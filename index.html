<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KALI">
  <meta name="theme-color" content="#F7F7F8" id="themeColorMeta">
  <title>KALI</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS — SWISS / BRAUN / NATIVE iOS FLAT MONOCHROME
       ========================================================================= */
    :root,
    [data-theme="light"] {
      --bg: #F7F7F8;
      --card: #FFFFFF;
      --surface: #EFEFF1;
      --ink: #0A0A0A;
      --muted: #6E6E73;
      --line: rgba(0, 0, 0, 0.09);
      --line-strong: rgba(0, 0, 0, 0.18);
      --accent: #0A0A0A;
      --accent-ink: #FFFFFF;
      --bar-bg: rgba(247, 247, 248, 0.92);
      --backdrop: rgba(0, 0, 0, 0.42);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card: #111113;
      --surface: #1C1C1F;
      --ink: #F5F5F7;
      --muted: #8E8E93;
      --line: rgba(255, 255, 255, 0.11);
      --line-strong: rgba(255, 255, 255, 0.22);
      --accent: #FFFFFF;
      --accent-ink: #000000;
      --bar-bg: rgba(0, 0, 0, 0.90);
      --backdrop: rgba(0, 0, 0, 0.72);
    }

    /* =========================================================================
       2. RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    button:disabled {
      opacity: 0.34;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================================
       3. APP SHELL & SLIM TOP BAR
       ========================================================================= */
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: var(--bar-bg);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      padding: max(8px, env(safe-area-inset-top)) 16px 8px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .brand-cycle {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .active-status-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-tap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background-color 0.12s ease;
    }

    .icon-tap:active {
      background-color: var(--surface);
    }

    .text-action {
      min-height: 36px;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      border-radius: 8px;
      transition: color 0.12s ease, background-color 0.12s ease;
    }

    .text-action:active {
      color: var(--ink);
      background-color: var(--surface);
    }

    .text-action-ink {
      color: var(--ink);
    }

    /* Main content area with clean docked bottom offsets */
    .main-view {
      flex: 1;
      padding: 14px 16px 32px;
    }

    .main-view.pad-tabbar {
      padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
    }

    .main-view.pad-dnes {
      padding-bottom: calc(152px + env(safe-area-inset-bottom, 0px));
    }

    .stack-md {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stack-sm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =========================================================================
       4. ULTRA-TIGHT HERO & DAY SWITCHER
       ========================================================================= */
    .dnes-hero {
      padding: 2px 2px 0;
    }

    .hero-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-day-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .hero-day-num {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .hero-day-total {
      font-size: 17px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .hero-day-loc {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      padding-left: 8px;
      border-left: 1px solid var(--line-strong);
      line-height: 1.1;
    }

    .day-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .day-strip::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      flex-shrink: 0;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-color: var(--card);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .day-tab.selected {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    /* =========================================================================
       5. GROUPED LIST SECTIONS & COMPACT EXERCISE ROWS
       ========================================================================= */
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: -0.005em;
    }

    .section-meta {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .group-card {
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-pad {
      padding: 16px;
    }

    .ex-row {
      width: 100%;
      padding: 11px 12px 11px 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.12s ease;
    }

    .ex-row:last-child {
      border-bottom: none;
    }

    .ex-row:active {
      background-color: var(--surface);
    }

    .ex-icon-slot {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      flex-shrink: 0;
    }

    .ex-body {
      flex: 1;
      min-width: 0;
    }

    .ex-title-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.3;
    }

    .new-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      padding: 1px 5px;
      line-height: 1.25;
      flex-shrink: 0;
    }

    .thumb-cue {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.3;
    }

    .ex-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      text-align: right;
    }

    .target-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .target-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .chevron {
      color: var(--ink);
      opacity: 0.3;
      display: inline-flex;
      align-items: center;
    }

    /* =========================================================================
       6. BUTTONS (12px RADIUS, FLAT, ZERO SHADOW)
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: opacity 0.12s ease, background-color 0.12s ease;
    }

    .btn:active:not(:disabled) {
      opacity: 0.78;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn-outline {
      background-color: var(--card);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      height: 46px;
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--ink);
      height: 46px;
    }

    /* =========================================================================
       7. DOCKED BOTTOM ACTION BAR & NATIVE iOS TAB BAR
       ========================================================================= */
    .docked-action-bar {
      position: fixed;
      bottom: calc(56px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      background-color: var(--bar-bg);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      z-index: 35;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background-color: var(--bar-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 40;
    }

    .tab-btn {
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      position: relative;
      transition: color 0.12s ease;
    }

    .tab-btn.active {
      color: var(--ink);
    }

    .tab-label {
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .tab-btn.active .tab-label {
      font-weight: 600;
    }

    .tab-count {
      position: absolute;
      top: 7px;
      left: calc(50% + 10px);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      line-height: 1;
    }

    /* =========================================================================
       8. WARMUP CHECKLIST (24px CIRCULAR CHECKBOXES ONLY)
       ========================================================================= */
    .wu-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px 12px 14px;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.14s ease;
    }

    .wu-row:last-child {
      border-bottom: none;
    }

    .wu-row.done {
      opacity: 0.48;
    }

    .wu-toggle {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      min-height: 36px;
    }

    .wu-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .wu-row.done .wu-circle {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .wu-row.done .ex-name {
      text-decoration: line-through;
    }

    /* =========================================================================
       9. ACTIVE WORKOUT — PROGRESS SEGMENTS, NOTICES & DUAL SLIDERS
       ========================================================================= */
    .round-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .round-bar-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .round-segments {
      display: flex;
      gap: 4px;
      height: 3px;
    }

    .round-seg {
      flex: 1;
      border-radius: 2px;
      background-color: var(--line);
    }

    .round-seg.done {
      background-color: var(--muted);
    }

    .round-seg.active {
      background-color: var(--ink);
    }

    .round-notice {
      border-left: 3px solid var(--ink);
      background-color: var(--card);
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: 0 10px 10px 0;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .round-notice.intense {
      background-color: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    .active-card-head {
      width: 100%;
      padding: 12px 14px 12px 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.12s ease;
    }

    .active-card-head:active {
      background-color: var(--surface);
    }

    .sliders-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slider-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-section.secondary {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .slider-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .slider-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .slider-section.secondary .slider-label {
      color: var(--muted);
      font-weight: 500;
    }

    .slider-readout {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .slider-num {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--ink);
    }

    .slider-section.secondary .slider-num {
      font-size: 20px;
      color: var(--muted);
    }

    .slider-section.secondary.has-val .slider-num {
      color: var(--ink);
    }

    .slider-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .bonus-delta {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .slider-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Circular steppers (40px primary / 36px secondary) */
    .step-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 20px;
      font-weight: 500;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.1s ease, color 0.1s ease;
    }

    .step-btn:active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .step-btn.sm {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }

    /* Flat monochrome range slider (ZERO box-shadow) */
    .kali-range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 36px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }

    .kali-range::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track-bg, var(--surface));
    }

    .kali-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--ink);
      margin-top: -9px;
    }

    .kali-range::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track-bg, var(--surface));
    }

    .kali-range::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--ink);
    }

    .kali-range.secondary-range::-webkit-slider-thumb {
      width: 19px;
      height: 19px;
      margin-top: -7.5px;
      border-width: 1.5px;
      border-color: var(--muted);
    }

    .kali-range.secondary-range::-moz-range-thumb {
      width: 19px;
      height: 19px;
      border-width: 1.5px;
      border-color: var(--muted);
    }

    /* Segmented controls (iOS flat style, 10px radius) */
    .segmented {
      display: grid;
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background-color: var(--surface);
    }

    .segmented-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .segmented-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .seg-btn {
      min-height: 38px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .seg-btn.selected {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    /* =========================================================================
       10. POST-WORKOUT CHECK-IN (2x5 GRID, FLAT TAGS)
       ========================================================================= */
    .diff-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .diff-btn {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.1s ease, color 0.1s ease, border-color 0.1s ease;
    }

    .diff-btn.selected {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tag-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.1s ease, color 0.1s ease, border-color 0.1s ease;
    }

    .tag-btn.selected {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.4;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--ink);
      background-color: var(--card);
    }

    .field-input::placeholder {
      color: var(--muted);
    }

    /* =========================================================================
       11. COACH & SUMMARY STATS
       ========================================================================= */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--bg);
    }

    .stat-cell {
      padding: 12px 14px;
    }

    .stat-cell:first-child {
      border-right: 1px solid var(--line);
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .stat-lbl {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .history-row {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .history-row:last-child {
      border-bottom: none;
    }

    .notice-bar {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      border: 1px solid var(--line);
    }

    .notice-bar.ok {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .notice-bar.err {
      background-color: var(--card);
      color: var(--ink);
      border-color: var(--ink);
    }

    .new-list-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      background-color: var(--card);
      padding: 12px 14px;
    }

    .new-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 8px;
    }

    .inline-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--line-strong);
      padding: 3px 0;
    }

    .code-box {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      white-space: pre;
    }

    /* =========================================================================
       12. DETAIL BOTTOM SHEET & CONFIRM DIALOG (ZERO SHADOW)
       ========================================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background-color: var(--backdrop);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-panel {
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      background-color: var(--card);
      color: var(--ink);
      border-top: 1px solid var(--line-strong);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(28px);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background-color: var(--line-strong);
      margin: 8px auto 0;
      flex-shrink: 0;
    }

    .sheet-top {
      padding: 8px 14px 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .sheet-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 18px 28px;
    }

    .spec-table {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .spec-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .spec-line:last-child {
      border-bottom: none;
    }

    .spec-k {
      color: var(--muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .spec-v {
      color: var(--ink);
      font-weight: 600;
      text-align: right;
    }

    .step-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .step-idx {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      width: 16px;
      flex-shrink: 0;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 95;
      background-color: var(--backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dialog-card {
      width: 100%;
      max-width: 332px;
      background-color: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 20px;
    }

    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
  </style>
</head>

      /* =========================================================================
         4. STATE MANAGEMENT & AUTOMATIC v3 -> v4 MIGRATION
         ========================================================================= */
      function createFreshState() {
        return {
          version: 4,
          plan: getDefaultPlan(),
          currentDayIndex: 0,
          cycleNumber: 1,
          completedExerciseIds: getInitialCompletedIds(),
          history: [],
          activeSession: null
        };
      }

      function loadState() {
        try {
          const rawV4 = localStorage.getItem(STORAGE_KEY);
          if (rawV4) {
            const parsed = JSON.parse(rawV4);
            if (parsed && parsed.plan && Array.isArray(parsed.plan.days) && parsed.plan.days.length > 0) {
              if (!Array.isArray(parsed.completedExerciseIds)) parsed.completedExerciseIds = getInitialCompletedIds();
              if (!Array.isArray(parsed.history)) parsed.history = [];
              if (typeof parsed.currentDayIndex !== 'number') parsed.currentDayIndex = 0;
              parsed.currentDayIndex = ((parsed.currentDayIndex % parsed.plan.days.length) + parsed.plan.days.length) % parsed.plan.days.length;
              if (typeof parsed.cycleNumber !== 'number' || parsed.cycleNumber < 1) parsed.cycleNumber = 1;
              return parsed;
            }
          }

          /* Migrate seamlessly from kali_v3_data if present */
          const rawV3 = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (rawV3) {
            const v3 = JSON.parse(rawV3);
            const fresh = createFreshState();
            if (v3 && Array.isArray(v3.history)) fresh.history = v3.history;
            if (v3 && typeof v3.cycleNumber === 'number' && v3.cycleNumber >= 1) fresh.cycleNumber = v3.cycleNumber;
            if (v3 && Array.isArray(v3.completedExerciseIds)) {
              const merged = new Set([...getInitialCompletedIds(), ...v3.completedExerciseIds]);
              fresh.completedExerciseIds = Array.from(merged);
            }
            return fresh;
          }
        } catch (err) {
          return createFreshState();
        }
        return createFreshState();
      }

      let state = loadState();

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {

      function esc(val) {
        return String(val == null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function applyTheme(next) {
        ui.theme = next === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', ui.theme);
        localStorage.setItem(THEME_KEY, ui.theme);
        const meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', ui.theme === 'dark' ? '#000000' : '#F7F7F8');
      }

      function isNewExercise(exId) {
        return !state.completedExerciseIds.includes(exId);
      }

      function getDayLocation(day) {
        if (day && day.location) return day.location;
        const t = String((day && day.title) || '').toLowerCase();
        return t.includes('doma') ? 'Doma' : 'Venku';
      }

      function getYouTubeUrl(query) {
        return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query || 'calisthenics form');
      }

      function formatDateCS(iso) {
        try {
          return new Date(iso).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
        } catch (e) {
          return (iso || '').slice(0, 10);
        }
      }

      function pluralRounds(n) {
        if (n === 1) return '1 kolo';
        if (n >= 2 && n <= 4) return `${n} kola`;
        return `${n} kol`;
      }

      function pluralDays(n) {
        if (n === 1) return '1 den';
        if (n >= 2 && n <= 4) return `${n} dny`;
        return `${n} dnů`;
      }

      function pluralExercises(n) {
        if (n === 1) return '1 cvik';
        if (n >= 2 && n <= 4) return `${n} cviky`;
        return `${n} cviků`;
      }

      function formatTargetHtml(ex) {
        const range = `${ex.targetMin}–${ex.targetMax}`;
        if (!ex.unit || ex.unit === 'op.') {
          return `<span class="target-text">${range}</span>`;
        }
        if (ex.unit === 'op. / noha') {
          return `<span class="target-text">${range}<span class="target-unit"> / noha</span></span>`;
        }
        return `<span class="target-text">${range}<span class="target-unit"> ${esc(ex.unit)}</span></span>`;
      }

      function formatTargetPlain(ex) {
        const range = `${ex.targetMin}–${ex.targetMax}`;
        if (!ex.unit || ex.unit === 'op.') return range;
        if (ex.unit === 'op. / noha') return `${range} / noha`;
        return `${range} ${ex.unit}`;
      }

      function getTrackStyle(val, max, isSecondary) {
        const pct = max > 0 ? Math.min(100, Math.max(0, (val / max) * 100)) : 0;
        const color = isSecondary ? 'var(--muted)' : 'var(--ink)';
        return `--track-bg: linear-gradient(to right, ${color} 0%, ${color} ${pct}%, var(--surface) ${pct}%, var(--surface) 100%);`;
      }

      function getSliderMax(ex, val, isPartial) {
        if (isPartial) return Math.max(12, val + 4);
        if (ex.type === 'time') return Math.max(ex.targetMax + 45, 90, val + 15);
        return Math.max(ex.targetMax + 10, 16, val + 4);
      }

      function findItemById(id) {
        for (const day of state.plan.days) {
          if (Array.isArray(day.warmup)) {
            const wu = day.warmup.find(w => w.id === id);
            if (wu) return { item: wu, isWarmup: true };
          }
          for (const block of day.blocks) {
            const ex = block.exercises.find(e => e.id === id);
            if (ex) return { item: ex, isWarmup: false };
          }
        }
        return null;
      }

      function copyTextReliable(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (err) {
          return false;
        }
      }

      /* =========================================================================
         7. ACTIVE WORKOUT FLOW & SILENT MICRO-PROGRESSION
         ========================================================================= */
      function startWorkout(dayIndex) {
        const day = state.plan.days[dayIndex];
        if (!day) return;

        const hasWarmup = Array.isArray(day.warmup) && day.warmup.length > 0;
        const logs = {};

        day.blocks.forEach((block, bIdx) => {
          const totalRounds = Math.max(1, Number(block.rounds) || 1);
          block.exercises.forEach(ex => {
            const key = `${bIdx}__${ex.id}`;
            logs[key] = [];
            for (let r = 0; r < totalRounds; r++) {
              if (ex.type === 'time') {
                logs[key].push({ seconds: Number(ex.targetMin) || 30 });
              } else {
                logs[key].push({ clean: Number(ex.targetMin) || 5, partial: 0 });
              }
            }
          });
        });

        state.activeSession = {
          dayIndex,
          dayId: day.id,
          startedAt: new Date().toISOString(),
          stage: hasWarmup ? 'warmup' : 'block',
          blockIndex: 0,
          roundIndex: 0,
          warmupDone: hasWarmup ? day.warmup.map(() => false) : [],
          logs,
          blockFeelings: day.blocks.map(() => null),
          checkin: {
            difficulty: 7,
            jointsStatus: 'ok',
            jointAreas: [],
            note: ''
          }
        };

        ui.savedSummary = null;
        ui.showDaySwitcher = false;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      function finishAndSaveWorkout() {
        const sess = state.activeSession;
        if (!sess) return;
        const day = state.plan.days[sess.dayIndex];
        if (!day) return;

        const ci = sess.checkin;
        const recordedBlocks = [];
        let totalSetsLogged = 0;

        day.blocks.forEach((block, bIdx) => {
          const totalRounds = Math.max(1, Number(block.rounds) || 1);
          const feelingId = sess.blockFeelings[bIdx];
          const feelingLabel = (FEELING_OPTIONS.find(f => f.id === feelingId) || {}).label || null;
          const exLogs = [];

          block.exercises.forEach(ex => {
            const key = `${bIdx}__${ex.id}`;
            const entries = sess.logs[key] || [];
            totalSetsLogged += entries.length;

            if (!state.completedExerciseIds.includes(ex.id)) {
              state.completedExerciseIds.push(ex.id);
            }

            const prevMin = ex.targetMin;
            const prevMax = ex.targetMax;
            let progressed = false;

            const allHitMax = entries.length > 0 && entries.every(entry =>
              ex.type === 'time' ? entry.seconds >= prevMax : entry.clean >= prevMax
            );

            if (!block.isSkill && allHitMax && ci.difficulty <= 9 && feelingId !== 'reserve') {
              const inc = ex.type === 'time' ? 5 : 1;
              ex.targetMin = prevMin + inc;
              ex.targetMax = prevMax + inc;
              progressed = true;
            }

            exLogs.push({
              id: ex.id,
              name: ex.name,
              type: ex.type,
              unit: ex.unit,
              targetBefore: `${prevMin}–${prevMax}`,
              targetAfter: `${ex.targetMin}–${ex.targetMax}`,
              progressed,
              rounds: entries
            });
          });

          recordedBlocks.push({
            id: block.id,
            title: block.title,
            roundsCount: totalRounds,
            lastRoundFeeling: feelingLabel,
            exercises: exLogs
          });
        });

        const dayLoc = getDayLocation(day);
        const sessionRecord = {
          id: 'log_' + Date.now(),
          timestamp: new Date().toISOString(),
          date: new Date().toISOString().slice(0, 10),
          cycle: state.cycleNumber,
          dayId: day.id,
          dayNumber: day.dayNumber,
          dayTitle: `Den ${day.dayNumber} · ${dayLoc}`,
          blocks: recordedBlocks,
          checkin: {
            difficulty: ci.difficulty,
            difficultyLabel: getDifficultyText(ci.difficulty),
            jointsStatus: ci.jointsStatus === 'ok' ? 'V pořádku' : 'Ozvalo se',
            jointAreas: ci.jointsStatus === 'ok' ? [] : [...ci.jointAreas],
            note: (ci.note || '').trim()
          },
          exported: false,
          exportedAt: null
        };

        state.history.push(sessionRecord);

        const nextIndex = (sess.dayIndex + 1) % state.plan.days.length;
        if (nextIndex === 0) state.cycleNumber += 1;
        state.currentDayIndex = nextIndex;
        ui.prepDayIndex = nextIndex;
        state.activeSession = null;

        const nextDay = state.plan.days[nextIndex];
        ui.savedSummary = {
          completedDayNumber: day.dayNumber,
          completedDayLocation: dayLoc,
          totalSetsLogged,
          difficulty: ci.difficulty,
          difficultyLabel: getDifficultyText(ci.difficulty),
          nextDayNumber: nextDay.dayNumber,
          nextDayLocation: getDayLocation(nextDay)
        };

        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      /* =========================================================================
         8. COACH EXPORT & DYNAMIC BACKWARD-COMPATIBLE JSON IMPORT
         ========================================================================= */
      function buildCoachExport(includeAll) {
        const unexported = state.history.filter(h => !h.exported);
        let list = [];
        let scope = '';

        if (includeAll) {
          list = state.history;
          scope = 'KOMPLETNI_HISTORIE';
        } else if (unexported.length > 0) {
          list = unexported;
          scope = 'NOVE_OD_POSLEDNIHO_EXPORTU';
        } else {
          list = state.history.slice(-3);
          scope = 'POSLEDNI_3_TRENINKY';
        }

        const payload = {
          app: 'KALI',
          exportScope: scope,
          exportedAt: new Date().toISOString(),
          planName: state.plan.planName || 'KALI',
          currentCycle: state.cycleNumber,
          totalWorkoutsLogged: state.history.length,
          exportedCount: list.length,
          workouts: list.map(s => ({
            date: s.date,
            cycle: s.cycle,
            day: s.dayTitle || `Den ${s.dayNumber}`,
            difficulty: `${s.checkin.difficulty}/10 (${s.checkin.difficultyLabel})`,
            joints: s.checkin.jointsStatus,
            jointAreas: s.checkin.jointAreas || [],
            note: s.checkin.note || null,
            blocks: (s.blocks || []).map(b => ({
              title: b.title,
              lastRoundFeeling: b.lastRoundFeeling,
              exercises: (b.exercises || []).map(e => ({
                name: e.name,
                target: `${e.targetBefore} ${e.unit}`,
                autoProgressedTo: e.progressed ? `${e.targetAfter} ${e.unit}` : null,
                rounds: e.type === 'time'
                  ? (e.rounds || []).map(r => `${r.seconds}s`)
                  : (e.rounds || []).map(r => r.partial > 0 ? `${r.clean} čistých + ${r.partial} neúplných` : `${r.clean} čistých`)
              }))
            }))
          }))
        };

        return {
          text: JSON.stringify(payload, null, 2),
          idsToMark: !includeAll ? unexported.map(h => h.id) : []
        };
      }

      function handleExport(includeAll) {
        if (state.history.length === 0) {
          ui.coachToast = { ok: false, text: 'Zatím není uložený žádný trénink.' };
          render();
          return;
        }

        const { text, idsToMark } = buildCoachExport(includeAll);
        const ok = copyTextReliable(text);

        if (ok) {
          if (idsToMark.length > 0) {
            const now = new Date().toISOString();
            state.history.forEach(h => {
              if (idsToMark.includes(h.id)) {
                h.exported = true;
                h.exportedAt = now;
              }
            });
            saveState();
          }
          ui.coachToast = {
            ok: true,
            text: includeAll
              ? `Celá historie zkopírována (${state.history.length}).`
              : 'Data pro Coache zkopírována.'
          };
        } else {
          ui.coachToast = { ok: false, text: 'Kopírování se nezdařilo.' };
        }
        render();
      }

      function normalizeImportedPlan(raw) {
        const parsed = JSON.parse(raw);
        let rawDays = null;
        let planName = 'Vlastní plán';

        if (Array.isArray(parsed)) {
          rawDays = parsed;
        } else if (parsed && Array.isArray(parsed.days)) {
          rawDays = parsed.days;
          if (parsed.planName) planName = String(parsed.planName);
        } else if (parsed && Array.isArray(parsed.workouts)) {
          rawDays = parsed.workouts;
          if (parsed.planName) planName = String(parsed.planName);
        }

        if (!rawDays || rawDays.length === 0) {
          throw new Error('JSON musí obsahovat pole "days".');
        }

        let totalExercises = 0;

        const days = rawDays.map((d, dIdx) => {
          const rawBlocks = Array.isArray(d.blocks) ? d.blocks : (Array.isArray(d.circuits) ? d.circuits : null);
          if (!rawBlocks || rawBlocks.length === 0) {
            throw new Error(`Den ${dIdx + 1} neobsahuje žádné bloky.`);
          }

          const inferredLoc = d.location
            ? String(d.location)
            : (String(d.title || '').toLowerCase().includes('doma') ? 'Doma' : 'Venku');

          const warmup = Array.isArray(d.warmup)
            ? d.warmup.map((w, wIdx) => ({
                id: String(w.id || `d${dIdx + 1}_wu_${wIdx + 1}`),
                name: String(w.name || `Rozcvička ${wIdx + 1}`),
                target: String(w.target || '30 s'),
                thumbCue: 'thumbCue' in w
                  ? (w.thumbCue ? String(w.thumbCue) : null)
                  : (w.gripBadge ? String(w.gripBadge) : null),
                grip: String(w.grip || 'Bez nářadí'),
                thumb: String(w.thumb || '—'),
                position: String(w.position || 'Plynulý rozsah'),
                icon: String(w.icon || 'generic'),
                steps: Array.isArray(w.steps) && w.steps.length ? w.steps.map(String) : ['Proveď plynule v plném rozsahu.'],
                mistakes: Array.isArray(w.mistakes) ? w.mistakes.map(String) : [],
                youtubeQuery: String(w.youtubeQuery || w.name || 'calisthenics warmup')
              }))
            : (inferredLoc === 'Doma' ? getHomeWarmup() : getOutdoorWarmup());

          const blocks = rawBlocks.map((b, bIdx) => {
            if (!Array.isArray(b.exercises) || b.exercises.length === 0) {
              throw new Error(`Blok ${bIdx + 1} (Den ${dIdx + 1}) nemá žádné cviky.`);
            }

            const exercises = b.exercises.map((ex, eIdx) => {
              if (!ex.name) {
                throw new Error(`Chybí název cviku (${eIdx + 1}) v bloku ${bIdx + 1}.`);
              }
              totalExercises++;
              const inferredType = ex.type === 'time' || ex.unit === 's' ? 'time' : 'reps';
              const tMin = Math.max(1, Number(ex.targetMin) || (inferredType === 'time' ? 30 : 5));
              const tMax = Math.max(tMin, Number(ex.targetMax) || (inferredType === 'time' ? tMin + 15 : tMin + 3));

              let thumbCue = null;
              if ('thumbCue' in ex) {
                thumbCue = ex.thumbCue ? String(ex.thumbCue) : null;
              } else if (ex.gripBadge || ex.gripTag) {
                thumbCue = String(ex.gripBadge || ex.gripTag);
              }

              return {
                id: String(ex.id || `d${dIdx + 1}_b${bIdx + 1}_e${eIdx + 1}`),
                name: String(ex.name),
                thumbCue,
                grip: String(ex.grip || ex.gripSpec || thumbCue || 'Standardní úchop'),
                thumb: String(ex.thumb || ex.thumbSpec || thumbCue || '—'),
                position: String(ex.position || ex.setupSpec || 'Plný kontrolovaný rozsah'),
                icon: String(ex.icon || ex.svg || 'generic'),
                type: inferredType,
                targetMin: tMin,
                targetMax: tMax,
                unit: String(ex.unit || (inferredType === 'time' ? 's' : 'op.')),
                steps: Array.isArray(ex.steps) && ex.steps.length ? ex.steps.map(String) : ['Proveď v plném rozsahu pod kontrolou.'],
                mistakes: Array.isArray(ex.mistakes) && ex.mistakes.length ? ex.mistakes.map(String) : ['Švihání a zkracování rozsahu.'],
                youtubeQuery: String(ex.youtubeQuery || ex.enName || ex.name)
              };
            });

            return {
              id: String(b.id || `d${dIdx + 1}_b${bIdx + 1}`),
              title: String(b.title || b.name || `Blok ${bIdx + 1}`),
              rounds: Math.max(1, Number(b.rounds) || 3),
              isFinisher: Boolean(b.isFinisher),
              isSkill: Boolean(b.isSkill),
              exercises
            };
          });

          return {
            id: String(d.id || `day_${dIdx + 1}`),
            dayNumber: Number(d.dayNumber || d.number) || (dIdx + 1),
            location: inferredLoc,
            title: String(d.title || `Den ${dIdx + 1}`),
            warmup,
            blocks
          };
        });

        return {
          plan: { planName, days },
          daysCount: days.length,
          totalExercises
        };
      }

      function handleImportPlan(rawText) {
        try {
          const { plan, daysCount, totalExercises } = normalizeImportedPlan(rawText);
          state.plan = plan;
          state.currentDayIndex = state.currentDayIndex % plan.days.length;
          ui.prepDayIndex = state.currentDayIndex;
          saveState();
          ui.coachToast = {
            ok: true,
            text: `Plán načten (${pluralDays(daysCount)}, ${pluralExercises(totalExercises)}). Historie zůstala.`
          };
        } catch (err) {
          ui.coachToast = {
            ok: false,
            text: `Chyba JSON: ${err.message}`
          };
        }
        render();
      }

          const cleanMax = getSliderMax(ex, cleanVal, false);

      /* =========================================================================
         11. LIVE ZERO-JANK SLIDER & STEPPER UPDATER
         ========================================================================= */
      function updateActiveLog(key, field, nextVal) {
        const sess = state.activeSession;
        if (!sess || sess.stage !== 'block') return;
        const day = state.plan.days[sess.dayIndex];
        const block = day.blocks[sess.blockIndex];
        const exId = key.split('__').slice(1).join('__');
        const ex = block.exercises.find(e => e.id === exId);
        if (!ex) return;

        const clamped = Math.max(0, Math.round(nextVal));
        sess.logs[key][sess.roundIndex][field] = clamped;
        saveState();

        if (field === 'partial') {
          const el = document.querySelector(`[data-val-partial="${key}"]`);
          if (el) el.textContent = clamped;
          const wrap = document.querySelector(`[data-partial-wrap="${key}"]`);
          if (wrap) wrap.classList.toggle('has-val', clamped > 0);
        } else {
          const el = document.querySelector(`[data-val-clean="${key}"]`);
          if (el) el.textContent = clamped;
        }

        const range = document.querySelector(`[data-range-key="${key}"][data-range-field="${field}"]`);
        if (range) {
          let curMax = Number(range.max);
          if (clamped > curMax) {
            curMax = clamped + (field === 'seconds' ? 15 : 4);
            range.max = curMax;
          }
          range.value = clamped;
          const pct = curMax > 0 ? Math.min(100, Math.max(0, (clamped / curMax) * 100)) : 0;
          const color = field === 'partial' ? 'var(--muted)' : 'var(--ink)';
          range.style.setProperty('--track-bg', `linear-gradient(to right, ${color} 0%, ${color} ${pct}%, var(--surface) ${pct}%, var(--surface) 100%)`);
        }

        const rTotal = Math.max(1, Number(block.rounds) || 1);
        if (rTotal > 1 && sess.roundIndex === rTotal - 1 && !block.isSkill && field !== 'partial') {
          const badge = document.querySelector(`[data-bonus-badge="${key}"]`);
          if (badge) {
            const diff = clamped - ex.targetMax;
            if (diff > 0) {
              badge.textContent = field === 'seconds' ? `+${diff} s` : `+${diff}`;
              badge.classList.remove('hidden');
            } else {
              badge.classList.add('hidden');
            }
          }
        }
      }

      /* =========================================================================
         12. MASTER RENDER & EVENT BINDING
         ========================================================================= */
      function render() {
        renderHeader();
        renderBottomBars();

        const main = document.getElementById('mainView');
        const sess = state.activeSession;

        if (sess) {
          if (sess.stage === 'warmup') main.innerHTML = renderWarmupStage();
          else if (sess.stage === 'block') main.innerHTML = renderBlockStage();
          else main.innerHTML = renderCheckinStage();
        } else if (ui.savedSummary) {
          main.innerHTML = renderSavedSummary();
        } else if (ui.tab === 'dnes') {
          main.innerHTML = renderDnesView();
        } else if (ui.tab === 'priprava') {
          main.innerHTML = renderPripravaView();
        } else {
          main.innerHTML = renderCoachView();
        }

        bindEvents();
      }

      function bindHeaderButtons() {
        const themeBtn = document.getElementById('themeToggleBtn');
        if (themeBtn) {
          themeBtn.addEventListener('click', () => {
            applyTheme(ui.theme === 'dark' ? 'light' : 'dark');
            renderHeader();
            bindHeaderButtons();
          });
        }

        const exitBtn = document.getElementById('exitWorkoutBtn');
        if (exitBtn) {
          exitBtn.addEventListener('click', () => {
            openConfirm(
              'Ukončit trénink?',
              'Rozjetý trénink se neuloží a dnešní den zůstane připravený.',
              () => {
                state.activeSession = null;
                saveState();
                render();
                window.scrollTo({ top: 0, behavior: 'instant' });
              }
            );
          });
        }
      }

      function bindEvents() {
        bindHeaderButtons();

        document.querySelectorAll('[data-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.tab = btn.getAttribute('data-tab');
            ui.coachToast = null;
            if (ui.tab === 'priprava') ui.prepDayIndex = state.currentDayIndex;
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        });

        document.querySelectorAll('[data-open-detail]').forEach(btn => {
          btn.addEventListener('click', () => {
            openDetailSheet(btn.getAttribute('data-open-detail'));
          });
        });

        const toggleDayBtn = document.getElementById('toggleDaySwitcherBtn');
        if (toggleDayBtn) {
          toggleDayBtn.addEventListener('click', () => {
            ui.showDaySwitcher = !ui.showDaySwitcher;
            render();
          });
        }

        document.querySelectorAll('[data-select-current-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.currentDayIndex = Number(btn.getAttribute('data-select-current-day'));
            ui.prepDayIndex = state.currentDayIndex;
            ui.showDaySwitcher = false;
            saveState();
            render();
          });
        });

        const startBtn = document.getElementById('startWorkoutBtn');
        if (startBtn) {
          startBtn.addEventListener('click', () => startWorkout(state.currentDayIndex));
        }

        document.querySelectorAll('[data-toggle-wu]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-toggle-wu'));
            state.activeSession.warmupDone[idx] = !state.activeSession.warmupDone[idx];
            saveState();
            render();
          });
        });

        const startFirstBlockBtn = document.getElementById('startFirstBlockBtn');
        if (startFirstBlockBtn) {
          startFirstBlockBtn.addEventListener('click', () => {
            state.activeSession.stage = 'block';
            state.activeSession.blockIndex = 0;
            state.activeSession.roundIndex = 0;
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        document.querySelectorAll('[data-range-key]').forEach(input => {
          input.addEventListener('input', e => {
            updateActiveLog(
              input.getAttribute('data-range-key'),
              input.getAttribute('data-range-field'),
              Number(e.target.value)
            );
          });
        });

        document.querySelectorAll('[data-step-key]').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-step-key');
            const field = btn.getAttribute('data-step-field');
            const delta = Number(btn.getAttribute('data-step-delta'));
            const cur = state.activeSession.logs[key][state.activeSession.roundIndex][field];
            updateActiveLog(key, field, cur + delta);
          });
        });

        document.querySelectorAll('[data-select-feeling]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeSession.blockFeelings[state.activeSession.blockIndex] = btn.getAttribute('data-select-feeling');
            saveState();
            render();
          });
        });

        const advanceBtn = document.getElementById('advanceBlockBtn');
        if (advanceBtn) {
          advanceBtn.addEventListener('click', () => {
            const sess = state.activeSession;
            const day = state.plan.days[sess.dayIndex];
            const blk = day.blocks[sess.blockIndex];
            const rTotal = Math.max(1, Number(blk.rounds) || 1);

            if (sess.roundIndex < rTotal - 1) {
              sess.roundIndex += 1;
            } else if (sess.blockIndex < day.blocks.length - 1) {
              sess.blockIndex += 1;
              sess.roundIndex = 0;
            } else {
              sess.stage = 'checkin';
            }
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        const goBackBtn = document.getElementById('goBackBtn');
        if (goBackBtn) {
          goBackBtn.addEventListener('click', () => {
            const sess = state.activeSession;
            const day = state.plan.days[sess.dayIndex];

            if (sess.roundIndex > 0) {
              sess.roundIndex -= 1;
            } else if (sess.blockIndex > 0) {
              sess.blockIndex -= 1;
              sess.roundIndex = Math.max(1, Number(day.blocks[sess.blockIndex].rounds) || 1) - 1;
            } else if (Array.isArray(day.warmup) && day.warmup.length > 0) {
              sess.stage = 'warmup';
            }
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        document.querySelectorAll('[data-diff-num]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeSession.checkin.difficulty = Number(btn.getAttribute('data-diff-num'));
            saveState();
            render();
          });
        });

        document.querySelectorAll('[data-joints-status]').forEach(btn => {
          btn.addEventListener('click', () => {
            const st = btn.getAttribute('data-joints-status');
            state.activeSession.checkin.jointsStatus = st;
            if (st === 'ok') state.activeSession.checkin.jointAreas = [];
            saveState();
            render();
          });
        });

        document.querySelectorAll('[data-joint-area]').forEach(btn => {
          btn.addEventListener('click', () => {
            const area = btn.getAttribute('data-joint-area');
            const arr = state.activeSession.checkin.jointAreas;
            const idx = arr.indexOf(area);
            if (idx >= 0) arr.splice(idx, 1);
            else arr.push(area);
            saveState();
            render();
          });
        });

        const noteInput = document.getElementById('checkinNote');
        if (noteInput) {
          noteInput.addEventListener('input', e => {
            state.activeSession.checkin.note = e.target.value;
            saveState();
          });
        }

        const saveBtn = document.getElementById('saveWorkoutBtn');
        if (saveBtn) saveBtn.addEventListener('click', finishAndSaveWorkout);

        const backCheckinBtn = document.getElementById('backFromCheckinBtn');
        if (backCheckinBtn) {
          backCheckinBtn.addEventListener('click', () => {
            const sess = state.activeSession;
            const day = state.plan.days[sess.dayIndex];
            const lastB = day.blocks.length - 1;
            sess.stage = 'block';
            sess.blockIndex = lastB;
            sess.roundIndex = Math.max(1, Number(day.blocks[lastB].rounds) || 1) - 1;
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        const doneHomeBtn = document.getElementById('doneToHomeBtn');
        if (doneHomeBtn) {
          doneHomeBtn.addEventListener('click', () => {
            ui.savedSummary = null;
            ui.tab = 'dnes';
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        document.querySelectorAll('[data-prep-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.prepDayIndex = Number(btn.getAttribute('data-prep-day'));
            render();
          });
        });

        const setTodayBtn = document.getElementById('setDayAsTodayBtn');
        if (setTodayBtn) {
          setTodayBtn.addEventListener('click', () => {
            state.currentDayIndex = ui.prepDayIndex;
            saveState();
            ui.tab = 'dnes';
            render();
            window.scrollTo({ top: 0, behavior: 'instant' });
          });
        }

        const exportNewBtn = document.getElementById('exportNewBtn');
        if (exportNewBtn) exportNewBtn.addEventListener('click', () => handleExport(false));

        const exportAllBtn = document.getElementById('exportAllBtn');
        if (exportAllBtn) exportAllBtn.addEventListener('click', () => handleExport(true));

        const importPlanBtn = document.getElementById('importPlanBtn');
        if (importPlanBtn) {
          importPlanBtn.addEventListener('click', () => {
            const area = document.getElementById('planImportArea');
            if (!area || !area.value.trim()) {
              ui.coachToast = { ok: false, text: 'Vlož nejprve JSON plán.' };
              render();
              return;
            }
            handleImportPlan(area.value.trim());
          });
        }

        const toggleSampleBtn = document.getElementById('toggleSampleBtn');
        if (toggleSampleBtn) {
          toggleSampleBtn.addEventListener('click', () => {
            ui.showSampleFormat = !ui.showSampleFormat;
            render();
          });
        }

        const copySampleBtn = document.getElementById('copySampleBtn');
        if (copySampleBtn) {
          copySampleBtn.addEventListener('click', () => {
            const ok = copyTextReliable(SAMPLE_PLAN_JSON);
            ui.coachToast = ok
              ? { ok: true, text: 'Ukázkový JSON zkopírován.' }
              : { ok: false, text: 'Kopírování se nezdařilo.' };
            render();
          });
        }

        const resetPlanBtn = document.getElementById('resetPlanBtn');
        if (resetPlanBtn) {
          resetPlanBtn.addEventListener('click', () => {
            openConfirm(
              'Obnovit výchozí plán?',
              'Obnoví výchozí 4denní zimní plán. Historie tréninků zůstane.',
              () => {
                state.plan = getDefaultPlan();
                state.currentDayIndex = 0;
                ui.prepDayIndex = 0;
                ui.coachToast = { ok: true, text: 'Výchozí 4denní plán obnoven.' };
                saveState();
                render();
              }
            );
          });
        }
      }

      document.getElementById('closeSheetBtn').addEventListener('click', closeDetailSheet);
      document.getElementById('detailSheet').addEventListener('click', e => {
        if (e.target.id === 'detailSheet') closeDetailSheet();
      });

      document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
      document.getElementById('confirmOkBtn').addEventListener('click', () => {
        const cb = ui.confirmCb;
        closeConfirm();
        if (typeof cb === 'function') cb();
      });
      document.getElementById('confirmDialog').addEventListener('click', e => {
        if (e.target.id === 'confirmDialog') closeConfirm();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeDetailSheet();
          closeConfirm();
        }
      });

      applyTheme(ui.theme);
      render();
    })();
  </script>
</body>
</html>
