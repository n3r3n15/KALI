<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KALI">
  <meta name="theme-color" content="#F5F5F7" id="themeColorMeta">
  <title>KALI</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS — APPLE / GEMINI MONOCHROME
       ========================================================================= */
    :root,
    [data-theme="light"] {
      --bg: #F5F5F7;
      --card: #FFFFFF;
      --surface: #EFEFF2;
      --surface-strong: #E4E4E9;
      --ink: #0A0A0A;
      --muted: #6E6E73;
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.16);
      --accent: #000000;
      --accent-ink: #FFFFFF;
      --accent-muted: rgba(255, 255, 255, 0.72);
      --nav-bg: rgba(255, 255, 255, 0.86);
      --backdrop: rgba(0, 0, 0, 0.42);
      --shadow-card: 0 2px 14px rgba(0, 0, 0, 0.045);
      --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.11);
      --shadow-thumb: 0 2px 6px rgba(0, 0, 0, 0.22);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card: #161618;
      --surface: #232326;
      --surface-strong: #2E2E32;
      --ink: #F5F5F7;
      --muted: #98989D;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.22);
      --accent: #FFFFFF;
      --accent-ink: #000000;
      --accent-muted: rgba(0, 0, 0, 0.65);
      --nav-bg: rgba(28, 28, 30, 0.86);
      --backdrop: rgba(0, 0, 0, 0.72);
      --shadow-card: 0 2px 14px rgba(0, 0, 0, 0.35);
      --shadow-float: 0 12px 34px rgba(0, 0, 0, 0.65);
      --shadow-thumb: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    /* =========================================================================
       2. RESET & SINGLE-FONT SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    button:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* =========================================================================
       3. LAYOUT SHELL
       ========================================================================= */
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: var(--bg);
      padding: max(12px, env(safe-area-inset-top)) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .main-view {
      flex: 1;
      padding: 6px 16px 32px;
    }

    .main-view.has-nav {
      padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
    }

    .main-view.has-cta {
      padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px));
    }

    /* =========================================================================
       4. CARDS, PILLS & ORGANIC BUTTONS
       ========================================================================= */
    .card {
      background-color: var(--card);
      border-radius: 24px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .card-pad {
      padding: 18px;
    }

    .section-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .icon-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--card);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      flex-shrink: 0;
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    .icon-circle-btn:active {
      transform: scale(0.93);
      background-color: var(--surface);
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 24px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.14s ease, opacity 0.14s ease, background-color 0.14s ease;
    }

    .pill-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .pill-btn-primary {
      background-color: var(--accent);
      color: var(--accent-ink);
      width: 100%;
    }

    .pill-btn-secondary {
      background-color: var(--surface);
      color: var(--ink);
      width: 100%;
      min-height: 48px;
      font-size: 15px;
    }

    .pill-btn-outline {
      background-color: var(--card);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      width: 100%;
      min-height: 48px;
      font-size: 15px;
    }

    .text-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.14s ease, transform 0.14s ease;
    }

    .text-link-pill:active {
      transform: scale(0.96);
    }

    .grip-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    .new-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 9999px;
      background-color: var(--accent);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      flex-shrink: 0;
    }

    .target-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bonus-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--accent);
      color: var(--accent-ink);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================================
       5. HERO & LIST ROWS
       ========================================================================= */
    .hero-kicker {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .hero-title {
      margin: 6px 0 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .hero-sub {
      margin: 8px 0 0;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.45;
    }

    .block-head {
      padding: 14px 18px 10px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .block-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .block-meta {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .ex-row {
      width: 100%;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.14s ease;
    }

    .ex-row:last-child {
      border-bottom: none;
    }

    .ex-row:active {
      background-color: var(--surface);
    }

    .ex-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background-color: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      flex-shrink: 0;
    }

    .ex-row-body {
      flex: 1;
      min-width: 0;
    }

    .ex-name-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.3;
    }

    .ex-tags-line {
      margin-top: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-row-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chevron {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
    }

    /* =========================================================================
       6. WARMUP CHECKLIST (CIRCULAR CHECKBOXES)
       ========================================================================= */
    .wu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.16s ease;
    }

    .wu-item:last-child {
      border-bottom: none;
    }

    .wu-item.done {
      opacity: 0.52;
    }

    .wu-toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      min-height: 44px;
    }

    .check-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--line-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .wu-item.done .check-circle {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .wu-item.done .ex-name {
      text-decoration: line-through;
    }

    /* =========================================================================
       7. ACTIVE WORKOUT — PROGRESS DOTS, DUAL SLIDERS & CIRCLE STEPPERS
       ========================================================================= */
    .progress-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .p-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--surface-strong);
      transition: all 0.2s ease;
    }

    .p-dot.done {
      background-color: var(--ink);
      opacity: 0.4;
    }

    .p-dot.active {
      width: 22px;
      border-radius: 9999px;
      background-color: var(--ink);
      opacity: 1;
    }

    .failure-banner {
      background-color: var(--accent);
      color: var(--accent-ink);
      border-radius: 24px;
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
    }

    .failure-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: rgba(128, 128, 128, 0.24);
      font-size: 12px;
      font-weight: 600;
    }

    .failure-copy {
      margin: 10px 0 0;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--accent-ink);
    }

    .round-banner {
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-card);
    }

    .ex-card-header {
      width: 100%;
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.14s ease;
    }

    .ex-card-header:active {
      background-color: var(--surface);
    }

    .sliders-wrap {
      padding: 14px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slider-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-block.secondary {
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .slider-label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .slider-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .slider-block.secondary .slider-title {
      color: var(--muted);
      font-weight: 500;
    }

    .slider-sub {
      font-size: 12px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 400;
    }

    .slider-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .slider-big-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .slider-block.secondary .slider-big-num {
      font-size: 22px;
      color: var(--muted);
    }

    .slider-block.secondary.has-val .slider-big-num {
      color: var(--ink);
    }

    .slider-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .slider-control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .step-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 22px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.12s ease, color 0.12s ease;
    }

    .step-circle:active {
      transform: scale(0.92);
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .step-circle.sm {
      width: 38px;
      height: 38px;
      font-size: 19px;
    }

    /* Native iOS-style circular-thumb range slider */
    .apple-range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 36px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }

    .apple-range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 9999px;
      background: var(--track-bg, var(--surface-strong));
    }

    .apple-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-thumb);
      margin-top: -10px;
      transition: transform 0.12s ease;
    }

    .apple-range:active::-webkit-slider-thumb {
      transform: scale(1.12);
    }

    .apple-range::-moz-range-track {
      height: 6px;
      border-radius: 9999px;
      background: var(--track-bg, var(--surface-strong));
    }

    .apple-range::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-thumb);
    }

    .apple-range.secondary-range::-webkit-slider-thumb {
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-width: 1.75px;
      border-color: var(--muted);
    }

    .apple-range.secondary-range::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-width: 1.75px;
      border-color: var(--muted);
    }

    /* Feeling selector pills */
    .choice-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .choice-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice-pill {
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .choice-pill:active {
      transform: scale(0.97);
    }

    .choice-pill.selected {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    /* =========================================================================
       8. POST-WORKOUT CHECK-IN (1-10 SCALE CIRCLES)
       ========================================================================= */
    .scale-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      justify-items: center;
    }

    .scale-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background-color 0.14s ease, color 0.14s ease;
    }

    .scale-circle:active {
      transform: scale(0.92);
    }

    .scale-circle.selected {
      background-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }

    .scale-desc-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 16px;
      background-color: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip-pill {
      padding: 9px 15px;
      border-radius: 9999px;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.14s ease;
    }

    .chip-pill.selected {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .text-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .text-field:focus {
      border-color: var(--ink);
      background-color: var(--card);
    }

    .text-field::placeholder {
      color: var(--muted);
    }

    /* =========================================================================
       9. FLOATING APPLE/iOS BOTTOM NAV & STICKY CTA
       ========================================================================= */
    .sticky-start-wrap {
      position: fixed;
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      z-index: 35;
      pointer-events: none;
    }

    .sticky-start-wrap > * {
      pointer-events: auto;
      box-shadow: var(--shadow-float);
    }

    .floating-nav-wrap {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 448px;
      z-index: 40;
    }

    .floating-nav {
      background-color: var(--nav-bg);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      box-shadow: var(--shadow-float);
    }

    .nav-pill {
      min-height: 48px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .nav-pill.active {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9999px;
      background-color: var(--surface-strong);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .nav-pill.active .nav-badge {
      background-color: rgba(128, 128, 128, 0.28);
      color: var(--accent-ink);
    }

    /* Horizontal day selector pills */
    .day-pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .day-pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-pill {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 9999px;
      background-color: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .day-pill.selected {
      background-color: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    /* =========================================================================
       10. BOTTOM SHEET & CONFIRM DIALOG
       ========================================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background-color: var(--backdrop);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-panel {
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      background-color: var(--card);
      color: var(--ink);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      transform: translateY(32px);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 9999px;
      background-color: var(--surface-strong);
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    .sheet-top {
      padding: 10px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .sheet-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 18px 28px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .spec-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 14px;
      background-color: var(--surface);
      font-size: 13px;
    }

    .spec-label {
      color: var(--muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .spec-val {
      color: var(--ink);
      font-weight: 600;
      text-align: right;
    }

    .step-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 95;
      background-color: var(--backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dialog-card {
      width: 100%;
      max-width: 340px;
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow-float);
    }

    /* =========================================================================
       11. COACH TAB SPECIFICS
       ========================================================================= */
    .stat-pair {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-box {
      padding: 16px;
      border-radius: 18px;
      background-color: var(--surface);
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .stat-lbl {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .toast-banner {
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .toast-banner.ok {
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .toast-banner.err {
      background-color: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }

    .code-preview {
      margin: 0;
      padding: 14px;
      border-radius: 16px;
      background-color: var(--surface);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sticky Top Header -->
    <header class="top-header" id="topHeader"></header>

        </button>
      </div>
      <div class="sheet-scroll" id="detailSheetBody"></div>
    </div>
  </div>

      <h2 id="confirmTitle" style="margin:0;font-size:18px;font-weight:700;letter-spacing:-0.02em;"></h2>

  </div>

  <script>
    (function () {
      'use strict';

      /* =========================================================================
         1. CONSTANTS & DIFFICULTY SCALE DESCRIPTIONS

      function getDifficultyText(score) {
        if (score <= 3) return 'Hodně lehký';

        if (score === 8) return 'Těžký a kvalitní trénink';
        if (score === 9) return 'Hodně na hraně, skoro nic nezbylo';
        return 'Totální maximum, úplné dno';

      /* =========================================================================
         4. STATE MANAGEMENT & PERSISTENCE
         ========================================================================= */
      function createFreshState() {
        return {
          version: 3,
          plan: getDefaultPlan(),
          currentDayIndex: 0,
          cycleNumber: 1,
          completedExerciseIds: getInitialCompletedIds(),
          history: [],
          activeSession: null
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createFreshState();
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.plan || !Array.isArray(parsed.plan.days) || parsed.plan.days.length === 0) {
            return createFreshState();
          }
          if (!Array.isArray(parsed.completedExerciseIds)) parsed.completedExerciseIds = getInitialCompletedIds();
          if (!Array.isArray(parsed.history)) parsed.history = [];
          if (typeof parsed.currentDayIndex !== 'number') parsed.currentDayIndex = 0;
          parsed.currentDayIndex = ((parsed.currentDayIndex % parsed.plan.days.length) + parsed.plan.days.length) % parsed.plan.days.length;
          if (typeof parsed.cycleNumber !== 'number') parsed.cycleNumber = 1;
          return parsed;
        } catch (err) {
          return createFreshState();
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Gracefully ignore storage quota issues
        }
      }

      saveState();

      /* Ephemeral UI state */
      const ui = {
        theme: localStorage.getItem(THEME_KEY) || 'light',
        tab: 'dnes', // 'dnes' | 'priprava' | 'coach'
        prepDayIndex: state.currentDayIndex,
        showDayPickerOnDnes: false,
        savedSummary: null,
        coachToast: null,
        showSampleFormat: false,
        confirmCb: null
      };

      /* =========================================================================
         5. HELPERS
         ========================================================================= */
      function esc(val) {
        return String(val == null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function applyTheme(next) {
        ui.theme = next === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', ui.theme);
        localStorage.setItem(THEME_KEY, ui.theme);
        const meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', ui.theme === 'dark' ? '#000000' : '#F5F5F7');
      }

      function isNewExercise(exId) {
        return !state.completedExerciseIds.includes(exId);
      }

      function getYouTubeUrl(query) {
        return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query || 'calisthenics form');
      }

      function formatDateCS(iso) {
        try {
          return new Date(iso).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
        } catch (e) {
          return (iso || '').slice(0, 10);
        }
      }

      function pluralDays(n) {
        if (n === 1) return '1 den';
        if (n >= 2 && n <= 4) return `${n} dny`;
        return `${n} dnů`;
      }

      function pluralRounds(n) {
        if (n === 1) return '1 kolo';
        if (n >= 2 && n <= 4) return `${n} kola`;
        return `${n} kol`;
      }

      function pluralBlocks(n) {
        if (n === 1) return '1 okruh';
        if (n >= 2 && n <= 4) return `${n} okruhy`;
        return `${n} okruhů`;
      }

      function pluralExercises(n) {
        if (n === 1) return '1 cvik';
        if (n >= 2 && n <= 4) return `${n} cviky`;
        return `${n} cviků`;
      }

      function getTrackStyle(val, max) {
        const pct = max > 0 ? Math.min(100, Math.max(0, (val / max) * 100)) : 0;
        return `--track-bg: linear-gradient(to right, var(--ink) 0%, var(--ink) ${pct}%, var(--surface-strong) ${pct}%, var(--surface-strong) 100%);`;
      }

      function getSecondaryTrackStyle(val, max) {
        const pct = max > 0 ? Math.min(100, Math.max(0, (val / max) * 100)) : 0;
        return `--track-bg: linear-gradient(to right, var(--muted) 0%, var(--muted) ${pct}%, var(--surface-strong) ${pct}%, var(--surface-strong) 100%);`;
      }

      function getSliderMax(ex, val, isPartial) {
        if (isPartial) {
          return Math.max(12, val + 4);
        }
        if (ex.type === 'time') {
          return Math.max(ex.targetMax + 45, 90, val + 15);
        }
        return Math.max(ex.targetMax + 10, 16, val + 4);
      }

      function findItemById(id) {
        for (const day of state.plan.days) {
          if (Array.isArray(day.warmup)) {
            const wu = day.warmup.find(w => w.id === id);
            if (wu) return { item: wu, isWarmup: true };
          }
          for (const block of day.blocks) {
            const ex = block.exercises.find(e => e.id === id);
            if (ex) return { item: ex, isWarmup: false };
          }
        }
        return null;
      }

      function copyTextReliable(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (err) {
          return false;
        }
      }

      /* =========================================================================
         7. DYNAMIC ACTIVE WORKOUT FLOW & SILENT MICRO-PROGRESSION
         ========================================================================= */
      function startWorkout(dayIndex) {
        const day = state.plan.days[dayIndex];
        if (!day) return;

        const hasWarmup = Array.isArray(day.warmup) && day.warmup.length > 0;
        const logs = {};

        day.blocks.forEach((block, bIdx) => {
          const totalRounds = Math.max(1, Number(block.rounds) || 1);
          block.exercises.forEach(ex => {
            const key = `${bIdx}__${ex.id}`;
            logs[key] = [];
            for (let r = 0; r < totalRounds; r++) {
              if (ex.type === 'time') {
                logs[key].push({ seconds: Number(ex.targetMin) || 30 });
              } else {
                logs[key].push({ clean: Number(ex.targetMin) || 5, partial: 0 });
              }
            }
          });
        });

        state.activeSession = {
          dayIndex,
          dayId: day.id,
          startedAt: new Date().toISOString(),
          stage: hasWarmup ? 'warmup' : 'block', // 'warmup' | 'block' | 'checkin'
          blockIndex: 0,
          roundIndex: 0,
          warmupDone: hasWarmup ? day.warmup.map(() => false) : [],
          logs,
          blockFeelings: day.blocks.map(() => null),
          checkin: {
            difficulty: 7,
            jointsStatus: 'ok', // 'ok' | 'issue'
            jointAreas: [],
            note: ''
          }
        };

        ui.savedSummary = null;
        ui.showDayPickerOnDnes = false;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      function finishAndSaveWorkout() {
        const sess = state.activeSession;
        if (!sess) return;
        const day = state.plan.days[sess.dayIndex];
        if (!day) return;

        const ci = sess.checkin;
        const recordedBlocks = [];
        let totalSetsLogged = 0;
        let breakthroughsCount = 0;

        day.blocks.forEach((block, bIdx) => {
          const totalRounds = Math.max(1, Number(block.rounds) || 1);
          const feelingId = sess.blockFeelings[bIdx];
          const feelingLabel = (FEELING_OPTIONS.find(f => f.id === feelingId) || {}).label || null;
          const exLogs = [];

          block.exercises.forEach(ex => {
            const key = `${bIdx}__${ex.id}`;
            const entries = sess.logs[key] || [];
            totalSetsLogged += entries.length;

            // Mark exercise as known (removes "Nový" pill)
            if (!state.completedExerciseIds.includes(ex.id)) {
              state.completedExerciseIds.push(ex.id);
            }

            // Track last-round breakthroughs
            const lastEntry = entries[entries.length - 1];
            if (totalRounds > 1 && lastEntry) {
              if (ex.type === 'time' && lastEntry.seconds > ex.targetMax) breakthroughsCount++;
              if (ex.type !== 'time' && lastEntry.clean > ex.targetMax) breakthroughsCount++;
            }

            // Silent micro-progression:
            // If user hits >= targetMax clean reps (or seconds) in ALL rounds of the exercise
            // without overreaching (difficulty <= 9) and feeling is not 'reserve' -> quietly +1 (or +5s)
            const prevMin = ex.targetMin;
            const prevMax = ex.targetMax;
            let progressed = false;

            const allHitMax = entries.length > 0 && entries.every(entry =>
              ex.type === 'time' ? entry.seconds >= prevMax : entry.clean >= prevMax
            );

            const validEffort = ci.difficulty <= 9 && feelingId !== 'reserve';
            if (allHitMax && validEffort) {
              const inc = ex.type === 'time' ? 5 : 1;
              ex.targetMin = prevMin + inc;
              ex.targetMax = prevMax + inc;
              progressed = true;
            }

            exLogs.push({
              id: ex.id,
              name: ex.name,
              type: ex.type,
              unit: ex.unit,
              targetBefore: `${prevMin}–${prevMax}`,
              targetAfter: `${ex.targetMin}–${ex.targetMax}`,
              progressed,
              rounds: entries
            });
          });

          recordedBlocks.push({
            id: block.id,
            title: block.title,
            roundsCount: totalRounds,
            lastRoundFeeling: feelingLabel,
            exercises: exLogs
          });
        });

        const sessionRecord = {
          id: 'log_' + Date.now(),
          timestamp: new Date().toISOString(),
          date: new Date().toISOString().slice(0, 10),
          cycle: state.cycleNumber,
          dayId: day.id,
          dayNumber: day.dayNumber,
          dayTitle: day.title,
          blocks: recordedBlocks,
          checkin: {
            difficulty: ci.difficulty,
            difficultyLabel: getDifficultyText(ci.difficulty),
            jointsStatus: ci.jointsStatus === 'ok' ? 'Vše v pohodě' : 'Něco se ozvalo',
            jointAreas: ci.jointsStatus === 'ok' ? [] : [...ci.jointAreas],
            note: (ci.note || '').trim()
          },
          exported: false,
          exportedAt: null
        };

        state.history.push(sessionRecord);

        // Automatically advance to next day in the plan
        const nextIndex = (sess.dayIndex + 1) % state.plan.days.length;
        if (nextIndex === 0) {
          state.cycleNumber += 1;
        }
        state.currentDayIndex = nextIndex;
        ui.prepDayIndex = nextIndex;
        state.activeSession = null;

        const nextDay = state.plan.days[nextIndex];
        ui.savedSummary = {
          completedDayNumber: day.dayNumber,
          completedDayTitle: day.title,
          totalSetsLogged,
          difficulty: ci.difficulty,
          difficultyLabel: getDifficultyText(ci.difficulty),
          breakthroughsCount,
          nextDayNumber: nextDay.dayNumber,
          nextDayTitle: nextDay.title
        };

        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      /* =========================================================================
         8. COACH EXPORT & DYNAMIC JSON PLAN IMPORT
         ========================================================================= */
      function buildCoachExport(includeAll) {
        const unexported = state.history.filter(h => !h.exported);
        let list = [];
        let scope = '';

        if (includeAll) {
          list = state.history;
          scope = 'KOMPLETNI_HISTORIE';
        } else if (unexported.length > 0) {
          list = unexported;
          scope = 'NOVE_OD_POSLEDNIHO_EXPORTU';
        } else {
          list = state.history.slice(-3);
          scope = 'POSLEDNI_3_TRENINKY';
        }

        const payload = {
          app: 'KALI',
          exportScope: scope,
          exportedAt: new Date().toISOString(),
          planName: state.plan.planName || 'KALI',
          currentCycle: state.cycleNumber,
          totalWorkoutsLogged: state.history.length,
          exportedCount: list.length,
          workouts: list.map(s => ({
            date: s.date,
            cycle: s.cycle,
            day: `Den ${s.dayNumber}: ${s.dayTitle}`,
            difficulty: `${s.checkin.difficulty}/10 (${s.checkin.difficultyLabel})`,
            joints: s.checkin.jointsStatus,
            jointAreas: s.checkin.jointAreas,
            note: s.checkin.note || null,
            blocks: s.blocks.map(b => ({
              title: b.title,
              lastRoundFeeling: b.lastRoundFeeling,
              exercises: b.exercises.map(e => ({
                name: e.name,
                target: `${e.targetBefore} ${e.unit}`,
                autoProgressedTo: e.progressed ? `${e.targetAfter} ${e.unit}` : null,
                rounds: e.type === 'time'
                  ? e.rounds.map(r => `${r.seconds}s`)
                  : e.rounds.map(r => r.partial > 0 ? `${r.clean} čistých + ${r.partial} neúplných` : `${r.clean} čistých`)
              }))
            }))
          }))
        };

        return {
          text: JSON.stringify(payload, null, 2),
          idsToMark: !includeAll ? unexported.map(h => h.id) : []
        };
      }

      function handleExport(includeAll) {
        if (state.history.length === 0) {
          ui.coachToast = { ok: false, text: 'Zatím nemáš žádný uložený trénink k exportu.' };
          render();
          return;
        }

        const { text, idsToMark } = buildCoachExport(includeAll);
        const ok = copyTextReliable(text);

        if (ok) {
          if (idsToMark.length > 0) {
            const now = new Date().toISOString();
            state.history.forEach(h => {
              if (idsToMark.includes(h.id)) {
                h.exported = true;
                h.exportedAt = now;
              }
            });
            saveState();
          }
          ui.coachToast = {
            ok: true,
            text: includeAll
              ? `Kompletní historie zkopírována (${state.history.length} tréninků).`
              : `Data pro Coache zkopírována do schránky.`
          };
        } else {
          ui.coachToast = { ok: false, text: 'Nepodařilo se zkopírovat do schránky.' };
        }
        render();
      }

      function normalizeImportedPlan(raw) {
        const parsed = JSON.parse(raw);
        let rawDays = null;
        let planName = 'Vlastní plán od Coache';

        if (Array.isArray(parsed)) {
          rawDays = parsed;
        } else if (parsed && Array.isArray(parsed.days)) {
          rawDays = parsed.days;
          if (parsed.planName) planName = String(parsed.planName);
        } else if (parsed && Array.isArray(parsed.workouts)) {
          rawDays = parsed.workouts;
          if (parsed.planName) planName = String(parsed.planName);
        }

        if (!rawDays || rawDays.length === 0) {
          throw new Error('JSON musí obsahovat neprázdné pole "days".');
        }

        let totalExercises = 0;

        const days = rawDays.map((d, dIdx) => {
          const rawBlocks = Array.isArray(d.blocks) ? d.blocks : (Array.isArray(d.circuits) ? d.circuits : null);
          if (!rawBlocks || rawBlocks.length === 0) {
            throw new Error(`Den ${dIdx + 1} neobsahuje žádné bloky ("blocks").`);
          }

          const warmup = Array.isArray(d.warmup)
            ? d.warmup.map((w, wIdx) => ({
                id: String(w.id || `d${dIdx + 1}_wu_${wIdx + 1}`),
                name: String(w.name || `Rozcvička ${wIdx + 1}`),
                target: String(w.target || '30 s'),
                gripBadge: String(w.gripBadge || w.grip || 'Rozcvička'),
                grip: String(w.grip || w.gripBadge || 'Bez nářadí'),
                thumb: String(w.thumb || '—'),
                position: String(w.position || 'Plynulý kontrolovaný pohyb'),
                icon: String(w.icon || 'generic'),
                steps: Array.isArray(w.steps) && w.steps.length ? w.steps.map(String) : ['Proveď plynule v plném rozsahu.'],
                mistakes: Array.isArray(w.mistakes) ? w.mistakes.map(String) : [],
                youtubeQuery: String(w.youtubeQuery || w.name || 'calisthenics warmup')
              }))
            : getStandardWarmup();

          const blocks = rawBlocks.map((b, bIdx) => {
            if (!Array.isArray(b.exercises) || b.exercises.length === 0) {
              throw new Error(`Blok ${bIdx + 1} ve Dnu ${dIdx + 1} nemá žádné cviky.`);
            }

            const exercises = b.exercises.map((ex, eIdx) => {
              if (!ex.name) {
                throw new Error(`Chybí název cviku (${eIdx + 1}) v bloku ${bIdx + 1} (Den ${dIdx + 1}).`);
              }
              totalExercises++;
              const inferredType = ex.type === 'time' || ex.unit === 's' ? 'time' : 'reps';
              const tMin = Math.max(1, Number(ex.targetMin) || (inferredType === 'time' ? 30 : 5));
              const tMax = Math.max(tMin, Number(ex.targetMax) || (inferredType === 'time' ? tMin + 15 : tMin + 3));

              return {
                id: String(ex.id || `d${dIdx + 1}_b${bIdx + 1}_e${eIdx + 1}`),
                name: String(ex.name),
                gripBadge: String(ex.gripBadge || ex.gripTag || ex.grip || 'Standardní úchop'),
                grip: String(ex.grip || ex.gripSpec || ex.gripBadge || 'Standardní úchop'),
                thumb: String(ex.thumb || ex.thumbSpec || 'Palec pevně obepíná tyč'),
                position: String(ex.position || ex.setupSpec || 'Plný kontrolovaný rozsah'),
                icon: String(ex.icon || ex.svg || 'generic'),
                type: inferredType,
                targetMin: tMin,
                targetMax: tMax,
                unit: String(ex.unit || (inferredType === 'time' ? 's' : 'op.')),
                steps: Array.isArray(ex.steps) && ex.steps.length ? ex.steps.map(String) : ['Proveď pohyb v plném rozsahu pod kontrolou.'],
                mistakes: Array.isArray(ex.mistakes) && ex.mistakes.length ? ex.mistakes.map(String) : ['Zkracování rozsahu a švihání.'],
                youtubeQuery: String(ex.youtubeQuery || ex.enName || ex.name)
              };
            });

            return {
              id: String(b.id || `d${dIdx + 1}_b${bIdx + 1}`),
              title: String(b.title || b.name || `Okruh ${bIdx + 1}`),
              subtitle: String(b.subtitle || ''),
              rounds: Math.max(1, Number(b.rounds) || 3),
              isFinisher: Boolean(b.isFinisher),
              exercises
            };
          });

          return {
            id: String(d.id || `day_${dIdx + 1}`),
            dayNumber: Number(d.dayNumber || d.number) || (dIdx + 1),
            title: String(d.title || `Den ${dIdx + 1}`),
            subtitle: String(d.subtitle || d.focus || ''),
            warmup,
            blocks
          };
        });

        return {
          plan: { planName, days },
          daysCount: days.length,
          totalExercises
        };
      }

      function handleImportPlan(rawText) {
        try {
          const { plan, daysCount, totalExercises } = normalizeImportedPlan(rawText);
          state.plan = plan;
          state.currentDayIndex = state.currentDayIndex % plan.days.length;
          ui.prepDayIndex = state.currentDayIndex;
          saveState();
          ui.coachToast = {
            ok: true,
            text: `Nahrán nový plán: ${pluralDays(daysCount)}, ${pluralExercises(totalExercises)}. Historie zůstala zachována.`

        } catch (err) {
          ui.coachToast = {
            ok: false,
            text: `Neplatný formát JSON: ${err.message}`
          };
        }
        render();
      }
